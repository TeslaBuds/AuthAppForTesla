# Auth for Tesla's own SwiftLint configuration (TeslaBuds/AuthAppForTesla#66).
#
# Auth for Tesla is open source and NOT a BrandKit app — Kim, 15 Oct 2026:
# "Is it gold? No? Then it's not gold brandkit. It's also not brandkit at all,
# since it's open source." So this file is Auth's own, not the block
# RumskrotShared's sync-house-lint.sh manages: it keeps SwiftLint's default
# rules and the global Swift/SwiftUI house rules (deprecated or legacy API
# bans that hold in any SwiftUI app), and none of the BrandKit rules (brand
# palette, BrandButton/BrandField/BrandDivider catalogue, glass, glance
# chrome). scripts/swiftlint-build-phase.sh runs it from every app and
# extension target, against .swiftlint-baseline.json.
#
# Kim, 18 Oct 2026: "Globally: warnings are errors." — strict: true turns
# every warning-level violation into a build error.
strict: true

# Build output and other agents' worktrees are not this repo's source
# (install-guardrails.py, WAFT#218).
excluded:
  - .claude
  - .build
  - "**/.build"
  - build
  - "DerivedData*"
  - "**/DerivedData*"
  - "**/SourcePackages"

custom_rules:
  no_title_only_cancel:
    name: "No title-only Cancel — SheetCancelButton instead (AuthAppForTesla#69)"
    # A bar item with a title and no icon is not shown when the bar is
    # vertical, and on the iPhone Duo's outer display a sheet's bar is
    # vertical by default: the sheet would have no way out.
    regex: 'Button\(\s*"Cancel"\s*\)'
    excluded_match_kinds:
      - comment
      - doccomment
    message: "A title-only Cancel disappears from a vertical sheet bar (iPhone Duo) — use SheetCancelButton, which has the cancel role and an icon"
    severity: error
  no_foreground_color:
    name: "No .foregroundColor( — .foregroundStyle( instead (house rules, RumskrotShared#25)"
    regex: '\.foregroundColor\('
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: ".foregroundColor( is deprecated — use .foregroundStyle(, see the global house rules"
    severity: error
  no_corner_radius:
    name: "No .cornerRadius( — .clipShape(.rect(cornerRadius:)) instead (house rules, RumskrotShared#25)"
    # Not BrandKit's BrandMonogramTile.cornerRadius(for:), a radius lookup (house rules, RumskrotShared#126).
    regex: '(?<!BrandMonogramTile)\.cornerRadius\('
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: ".cornerRadius( is deprecated — use .clipShape(.rect(cornerRadius:)), see the global house rules"
    severity: error
  no_tab_item:
    name: "No .tabItem — the Tab API instead (house rules, RumskrotShared#25)"
    regex: '\.tabItem\b'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: ".tabItem is the old tab API — use Tab(_:systemImage:) { … }, see the global house rules"
    severity: error
  no_navigation_view:
    name: "No NavigationView — NavigationStack instead (house rules, RumskrotShared#25)"
    regex: '\bNavigationView\b'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "NavigationView is deprecated — use NavigationStack, see the global house rules"
    severity: error
  no_observable_object:
    name: "No ObservableObject — an @Observable class instead (house rules, RumskrotShared#25)"
    regex: '\bObservableObject\b'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "ObservableObject is the legacy observation model — use an @MainActor @Observable class, see the global house rules"
    severity: error
  no_published:
    name: "No @Published — a plain property on an @Observable class instead (house rules, RumskrotShared#25)"
    regex: '@Published\b'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "@Published belongs to ObservableObject — use a plain property on an @Observable class, see the global house rules"
    severity: error
  no_state_object:
    name: "No @StateObject — @State owning an @Observable class instead (house rules, RumskrotShared#25)"
    regex: '@StateObject\b'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "@StateObject belongs to ObservableObject — own an @Observable class with @State, see the global house rules"
    severity: error
  no_observed_object:
    name: "No @ObservedObject — a plain property or @Bindable instead (house rules, RumskrotShared#25)"
    regex: '@ObservedObject\b'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "@ObservedObject belongs to ObservableObject — pass the @Observable model plainly or as @Bindable, see the global house rules"
    severity: error
  no_environment_object:
    name: "No @EnvironmentObject — @Environment(Model.self) instead (house rules, RumskrotShared#25)"
    regex: '@EnvironmentObject\b|\.environmentObject\('
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "EnvironmentObject belongs to ObservableObject — inject with .environment(model) and read @Environment(Model.self), see the global house rules"
    severity: error
  no_task_sleep_nanoseconds:
    name: "No Task.sleep(nanoseconds:) — Task.sleep(for:) instead (house rules, RumskrotShared#25)"
    regex: 'Task\.sleep\s*\(\s*nanoseconds\s*:'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "Task.sleep(nanoseconds:) — use Task.sleep(for: .seconds(…)), see the global house rules"
    severity: error
  no_uiscreen_main:
    name: "No UIScreen.main — the layout's own size (containerRelativeFrame, visualEffect) instead (house rules, RumskrotShared#25)"
    regex: '\bUIScreen\.main\b'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "UIScreen.main is deprecated and not the space a view has — use containerRelativeFrame / visualEffect, see the global house rules"
    severity: error
  no_shows_indicators:
    name: "No showsIndicators: — .scrollIndicators(_:) instead (house rules, RumskrotShared#25)"
    regex: 'showsIndicators\s*:'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "showsIndicators: in the ScrollView initialiser — use .scrollIndicators(.hidden), see the global house rules"
    severity: error
  no_foreach_array_enumerated:
    name: "No ForEach(Array(x.enumerated())) — ForEach(x.enumerated()) instead (house rules, RumskrotShared#25)"
    regex: 'ForEach\(\s*Array\([^)]*\.enumerated\(\)'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "ForEach(Array(….enumerated())) — pass the enumerated sequence directly, see the global house rules"
    severity: error
  no_font_weight_bold:
    name: "No .fontWeight(.bold) — .bold() instead (house rules, RumskrotShared#25)"
    regex: '\.fontWeight\(\s*\.bold\s*\)'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: ".fontWeight(.bold) — use .bold(), see the global house rules"
    severity: error
  no_string_format_numbers:
    name: "No String(format:) for numbers — a FormatStyle instead (house rules, RumskrotShared#122)"
    regex: 'String\s*\(\s*format\s*:\s*"[^"]*%[-+ 0-9.]*[fdeEgG]'
    excluded_match_kinds:
      - comment
      - doccomment
    message: "String(format:) with a numeric specifier — use a FormatStyle (Text(value, format: .number.precision(.fractionLength(2)))), see the global house rules"
    severity: error
  no_any_view:
    name: "No AnyView( unless absolutely required (house rules, RumskrotShared#122)"
    regex: '\bAnyView\('
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "AnyView( erases the view type — avoid it unless absolutely required, see the global house rules"
    severity: error
  no_scroll_view_reader:
    name: "No ScrollViewReader — ScrollPosition instead (house rules, RumskrotShared#122)"
    regex: '\bScrollViewReader\s*\{'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "ScrollViewReader forces a proxy through the view tree — use @State var position = ScrollPosition() with .scrollPosition($position), or .defaultScrollAnchor(_:), see the global house rules"
    severity: error
  no_replacing_occurrences:
    name: "No .replacingOccurrences(of: — .replacing(_:with:) instead (house rules, RumskrotShared#122)"
    regex: '\.replacingOccurrences\s*\(\s*of\s*:'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: ".replacingOccurrences(of:) — use Swift-native .replacing(_:with:), see the global house rules"
    severity: error
  no_on_tap_gesture:
    name: "No bare .onTapGesture — a Button, unless the count or the location is needed (house rules, RumskrotShared#135)"
    regex: '\.onTapGesture\b(?<!brand-lint:\s{0,3}allow\s{1,3}no_on_tap_gesture\s{1,3}[—-]\s{0,3}\S[^\n]{0,400}\n[^\n]{0,400})(?![^\n]*brand-lint:\s*allow\s+no_on_tap_gesture\s+[—-]\s*\S)(?!\s*\(\s*(?:count|coordinateSpace)\s*:)'
    excluded: '(?:^|/)[^/]*Tests/'   # test targets, as the Python twin's is_excluded
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: ".onTapGesture without count: or coordinateSpace: — use a Button; a bare tap has no focus, no VoiceOver trait and no chrome"
    severity: error
  no_dispatch_queue:
    name: "No DispatchQueue.main / .global() dispatch — modern Swift concurrency instead (house rules, RumskrotShared#135)"
    regex: '\bDispatchQueue(?<!brand-lint:\s{0,3}allow\s{1,3}no_dispatch_queue\s{1,3}[—-]\s{0,3}\S[^\n]{0,400}\n[^\n]{0,400})(?![^\n]*brand-lint:\s*allow\s+no_dispatch_queue\s+[—-]\s*\S)(?=\s*\.\s*(?:main|global\s*\([^)]*\))\s*\.\s*(?:async|asyncAfter|sync|asyncAndWait)\b)'
    excluded: '(?:^|/)[^/]*Tests/'   # test targets, as the Python twin's is_excluded
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "DispatchQueue.main / .global() dispatch is old-style GCD — use @MainActor / Task { } / Task.sleep(for:) instead, see the global house rules"
    severity: error
  no_legacy_formatters:
    name: "No legacy Formatter subclasses — FormatStyle instead (house rules, RumskrotShared#135)"
    regex: '\b(?:DateFormatter|NumberFormatter|MeasurementFormatter|DateComponentsFormatter|ByteCountFormatter|RelativeDateTimeFormatter|DateIntervalFormatter|PersonNameComponentsFormatter|ListFormatter|ISO8601DateFormatter)(?<!brand-lint:\s{0,3}allow\s{1,3}no_legacy_formatters\s{1,3}[—-]\s{0,3}\S[^\n]{0,400}\n[^\n]{0,400})(?![^\n]*brand-lint:\s*allow\s+no_legacy_formatters\s+[—-]\s*\S)\s*\('
    excluded: '(?:^|/)[^/]*Tests/'   # test targets, as the Python twin's is_excluded
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "A legacy Formatter subclass — use the FormatStyle API (.formatted(…), Date(_:strategy:)), see the global house rules"
    severity: error
  no_tint_nil:
    name: "`.tint(nil)` is not a no-op — skip the call instead (house rules, RumskrotNavigator#90)"
    regex: '\.tint(?<!brand-lint:\s{0,3}allow\s{1,3}no_tint_nil\s{1,3}[—-]\s{0,3}\S[^\n]{0,400}\n[^\n]{0,400})(?![^\n]*brand-lint:\s*allow\s+no_tint_nil\s+[—-]\s*\S)\(\s*nil\s*\)'
    excluded: '(?:^|/)[^/]*Tests/'   # test targets, as the Python twin's is_excluded
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: ".tint(nil) is an explicit reset to the platform default, not a no-op — it clears an ancestor's tint back to system blue. Skip the .tint(_:) call when there is nothing to set"
    severity: error
  # iPhone Duo readiness (TeslaBuds/AuthAppForTesla#66, DRSFramer#72) — SDK
  # conventions, not BrandKit look: Auth's own copies of RumskrotShared#178's
  # G1 and G9, because Auth does not run brand-rules.py.
  no_idiom_layout:
    name: "No layout on the device type — size classes and container size instead (#66, RumskrotShared#178 G1)"
    regex: '\buserInterfaceIdiom\b|UIDevice\s*\.\s*current\s*\.\s*orientation\b|\borientationDidChangeNotification\b|\.interfaceOrientation\b|\bUIInterfaceOrientation\b(?!Mask)'
    excluded: '(?:^|/)[^/]*Tests/'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "Apple: \"Don't use userInterfaceIdiom or UIInterfaceOrientation for layout decisions.\" Decide on horizontalSizeClass / verticalSizeClass or the container's size — on the iPhone Duo one device is compact and regular, portrait and landscape"
    severity: error
  no_page_tab_view:
    name: "No .page TabView — its dots sit over the page (#66, RumskrotShared#178 G9)"
    regex: '\.tabViewStyle\(\s*\.page\b'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "A .page TabView draws its index dots over the page; on a short display (the iPhone Duo's outer display, landscape, large text) they cover the text. Use a paging ScrollView with the dots in the layout, as OnboardingView does"
    severity: error
